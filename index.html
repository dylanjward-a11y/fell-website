<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FELL</title>
  <meta name="description" content="FELL — thrash metal from New Zealand.">
  <style>
    html, body { margin:0; padding:0; background:#050505; }
    body { min-height:100vh; }
    .site { position:relative; width:100%; max-width:1024px; margin:0 auto; line-height:0; }
    .site > img { display:block; width:100%; height:auto; }
    .hotspot { position:absolute; display:block; background:transparent; border:0; outline:0; text-decoration:none; }
    .hotspot:focus-visible { outline:2px solid #eee; outline-offset:4px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <main class="site" aria-label="FELL official website">
    <img src="assets/fell-website-mockupBETTER.png" alt="FELL — thrash metal band from New Zealand. Listen, follow, contact and view the electronic press kit.">

    <!-- Clickable hotspots positioned over the exact approved mock-up. Replace hrefs with the band's real links. -->
    <a class="hotspot" href="#" aria-label="Apple Music" style="left:29.3%; top:51.5%; width:8.4%; height:5.3%;"><span class="sr-only">Apple Music</span></a>
    <a class="hotspot" href="#" aria-label="Spotify" style="left:44.6%; top:51.5%; width:9.2%; height:5.3%;"><span class="sr-only">Spotify</span></a>
    <a class="hotspot" href="https://fellbandnz.bandcamp.com/" aria-label="Bandcamp" style="left:59.2%; top:51.5%; width:11.6%; height:5.3%;"><span class="sr-only">Bandcamp</span></a>

    <a class="hotspot" href="#" aria-label="Instagram" style="left:30.4%; top:64.4%; width:9.2%; height:5.3%;"><span class="sr-only">Instagram</span></a>
    <a class="hotspot" href="#" aria-label="Facebook" style="left:45.0%; top:64.4%; width:9.8%; height:5.3%;"><span class="sr-only">Facebook</span></a>
    <a class="hotspot" href="#" aria-label="YouTube" style="left:59.1%; top:64.4%; width:10.5%; height:5.3%;"><span class="sr-only">YouTube</span></a>

    <a class="hotspot" href="mailto:contact@fellband.com" aria-label="Email FELL" style="left:22.9%; top:77.5%; width:15%; height:4.1%;"><span class="sr-only">Email FELL</span></a>
    <a class="hotspot" href="#" aria-label="Electronic Press Kit" style="left:51.5%; top:77.5%; width:28%; height:4.1%;"><span class="sr-only">Electronic Press Kit</span></a>
  </main>
</body>
</html>

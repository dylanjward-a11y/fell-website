<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>FELL</title>

  <meta
    name="description"
    content="FELL — thrash metal from New Zealand."
  >

  <style>
    :root {
      --bg: #050505;
      --text: #f2f2f2;
      --line: rgba(255, 255, 255, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      text-align: center;
      overflow-x: hidden;
    }

    .site {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      padding: 55px 7% 0;
      position: relative;
    }

    /* =========================================================
       LOGO
       Uses the logo already inside your existing mockup image.
       ========================================================= */

    .logo-wrap {
      width: min(74vw, 665px);
      height: min(43vw, 440px);
      max-height: 440px;
      margin: 0 auto 25px;
      overflow: hidden;
      position: relative;
    }

    .logo-wrap img {
      position: absolute;
      width: 154%;
      max-width: none;
      left: -27%;
      top: -24%;
    }

    /* =========================================================
       DESCRIPTION
       THIS TEXT IS NOW EDITABLE.
       ========================================================= */

    .intro {
      width: min(94%, 780px);
      margin: 0 auto;
      font-size: clamp(13px, 1.5vw, 18px);
      line-height: 1.9;
      letter-spacing: 0.01em;
    }

    .intro p {
      margin: 0;
    }

    /* =========================================================
       DIVIDERS
       ========================================================= */

    .rule {
      width: min(70%, 350px);
      height: 1px;
      margin: 42px auto;
      background: linear-gradient(
        to right,
        transparent,
        var(--line),
        transparent
      );
    }

    /* =========================================================
       SECTION TITLES
       ========================================================= */

    .section-title {
      margin: 0 0 28px;
      font-size: clamp(13px, 1.35vw, 17px);
      font-weight: 400;
      letter-spacing: 0.16em;
    }

    /* =========================================================
       ICON LINKS
       ========================================================= */

    .links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(30px, 4.6vw, 58px);
      flex-wrap: wrap;
    }

    .icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      text-decoration: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .icon-link:hover,
    .icon-link:focus-visible {
      opacity: 0.72;
      transform: translateY(-2px);
    }

    .icon-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 7px;
    }

    .listen-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      color: #050505;
    }

    .follow-icon {
      width: 40px;
      height: 40px;
    }

    svg {
      width: 27px;
      height: 27px;
      fill: currentColor;
    }

    /* =========================================================
       CONTACT / EPK
       ========================================================= */

    .contact-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      flex-wrap: wrap;
      font-size: clamp(13px, 1.45vw, 17px);
    }

    .text-link {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    .text-link:hover,
    .text-link:focus-visible {
      opacity: 0.7;
    }

    /* =========================================================
       MOUNTAINS
       Uses the mountain artwork already inside the mockup.
       ========================================================= */

    .mountain-wrap {
      width: 100%;
      height: 300px;
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }

    .mountain-wrap img {
      position: absolute;
      width: 100%;
      max-width: none;
      height: auto;
      left: 0;
      top: -78%;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      position: relative;
      padding: 15px 0 30px;
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      .site {
        padding-top: 35px;
      }

      .logo-wrap {
        width: 84vw;
        height: 62vw;
      }

      .intro {
        width: 94%;
        font-size: 13px;
        line-height: 1.75;
      }

      .rule {
        margin: 32px auto;
      }

      .links {
        gap: 28px;
      }

      .contact-links {
        gap: 22px;
      }

      .mountain-wrap {
        height: 210px;
      }

      .footer {
        font-size: 12px;
      }
    }
  </style>
</head>


<body>

  <main class="site" aria-label="FELL official website">


    <!-- =======================================================
         FELL LOGO
         ======================================================= -->

    <header>

      <div class="logo-wrap" aria-hidden="true">
        <img src="assets/fell-mockup.png" alt="">
      </div>


      <!-- =====================================================
           BAND DESCRIPTION

           EDIT THESE THREE LINES DIRECTLY.
           ===================================================== -->

      <div class="intro">

        <p>FELL is a thrash metal band from New Zealand.</p>

        <p>Fast, heavy and uncompromising.</p>

        <p>We write aggressive music for a world that’s falling apart.</p>

      </div>

    </header>


    <!-- =======================================================
         LISTEN
         Apple Music
         Spotify
         Bandcamp
         ======================================================= -->

    <div class="rule"></div>


    <section aria-labelledby="listen-heading">

      <h2 class="section-title" id="listen-heading">
        LISTEN
      </h2>


      <nav class="links" aria-label="Listen to FELL">


        <!-- APPLE MUSIC
             Replace # with your real Apple Music URL -->

        <a
          class="icon-link listen-icon"
          href="#"
          aria-label="Apple Music"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16.45 2.5c-.06 0-.12.01-.18.02l-6.7 1.49A1.99 1.99 0 0 0 8 5.96v10.63a3.21 3.21 0 1 0 2 3.01V9.16l6.5-1.45v5.88a3.2 3.2 0 1 0 2 3.01V4.48a1.98 1.98 0 0 0-2.05-1.98Z"/>
          </svg>
        </a>


        <!-- SPOTIFY
             Replace # with your real Spotify URL -->

        <a
          class="icon-link listen-icon"
          href="#"
          aria-label="Spotify"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 0 18A9 9 0 0 0 12 3Zm4.13 11.88a.75.75 0 0 1-1.03.25c-2.83-1.73-6.39-2.12-10.59-1.16a.75.75 0 0 1-.3-1.47c4.59-.93 8.52-.48 11.67 1.45.35.21.46.67.25 1.03Zm1.38-2.99a.94.94 0 0 1-1.29.31c-3.24-1.99-8.18-2.57-12.01-1.4a.94.94 0 1 1-.55-1.8c4.38-1.33 9.85-.67 13.54 1.6.44.27.58.85.31 1.29Zm.12-3.11C13.75 6.7 7.17 6.49 3.33 7.66a1.13 1.13 0 0 1-.66-2.16c4.41-1.34 11.73-1.07 16.2 1.58a1.13 1.13 0 0 1-1.24 1.9Z"/>
          </svg>
        </a>


        <!-- BANDCAMP
             YOUR REAL LINK -->

        <a
          class="icon-link listen-icon"
          href="https://fellbandnz.bandcamp.com/"
          aria-label="Bandcamp"
        >
          <span
            style="
              font-family: Arial, sans-serif;
              font-size: 16px;
              font-weight: 700;
              letter-spacing: -2px;
            "
          >bc</span>
        </a>

      </nav>

    </section>


    <!-- =======================================================
         FOLLOW
         Instagram
         Facebook
         YouTube
         Email

         NO TIKTOK.
         ======================================================= -->

    <div class="rule"></div>


    <section aria-labelledby="follow-heading">

      <h2 class="section-title" id="follow-heading">
        FOLLOW
      </h2>


      <nav class="links" aria-label="Follow FELL">


        <!-- INSTAGRAM
             Replace # with real Instagram URL -->

        <a
          class="icon-link follow-icon"
          href="#"
          aria-label="Instagram"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5ZM17.5 6.2a1 1 0 1 1-1 1 1 1 0 0 1 1-1Z"/>
          </svg>
        </a>


        <!-- FACEBOOK
             Replace # with real Facebook URL -->

        <a
          class="icon-link follow-icon"
          href="#"
          aria-label="Facebook"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.87.24-1.46 1.48-1.46h1.58V3.96c-.27-.04-1.2-.12-2.29-.12-2.27 0-3.83 1.39-3.83 3.95V10H8v3h2.44v8h3.06Z"/>
          </svg>
        </a>


        <!-- YOUTUBE
             Replace # with real YouTube URL -->

        <a
          class="icon-link follow-icon"
          href="#"
          aria-label="YouTube"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.58 7.19a2.98 2.98 0 0 0-2.1-2.11C17.63 4.56 12 4.56 12 4.56s-5.63 0-7.48.52a2.98 2.98 0 0 0-2.1 2.11C1.9 9.05 1.9 12 1.9 12s0 2.95.52 4.81a2.98 2.98 0 0 0 2.1 2.11c1.85.52 7.48.52 7.48.52s5.63 0 7.48-.52a2.98 2.98 0 0 0 2.1-2.11c.52-1.86.52-4.81.52-4.81s0-2.95-.52-4.81ZM10.2 15.04V8.96L15.4 12l-5.2 3.04Z"/>
          </svg>
        </a>


        <!-- EMAIL -->

        <a
          class="icon-link follow-icon"
          href="mailto:contact@fellband.com"
          aria-label="Email FELL"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 5h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v.51l9 6.1 9-6.1V7H3Zm18 10V9.92l-8.44 5.72a1 1 0 0 1-1.12 0L3 9.92V17h18Z"/>
          </svg>
        </a>

      </nav>

    </section>


    <!-- =======================================================
         CONTACT
         ======================================================= -->

    <div class="rule"></div>


    <section aria-labelledby="contact-heading">

      <h2 class="section-title" id="contact-heading">
        CONTACT
      </h2>


      <div class="contact-links">

        <a
          class="text-link"
          href="mailto:contact@fellband.com"
        >
          contact@fellband.com
        </a>


        <!-- EPK -->

        <a
          class="text-link"
          href="epk.html"
        >
          ELECTRONIC PRESS KIT
        </a>

      </div>

    </section>


    <!-- =======================================================
         MOUNTAIN ARTWORK
         ======================================================= -->

    <div class="mountain-wrap" aria-hidden="true">

      <img
        src="assets/fell-mockup.png"
        alt=""
      >

    </div>


    <!-- =======================================================
         FOOTER
         ======================================================= -->

    <footer class="footer">
      © FELL 2024
    </footer>

  </main>

</body>
</html>
